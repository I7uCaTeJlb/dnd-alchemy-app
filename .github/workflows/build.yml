name: Cross-Platform Build & Release CI/CD

on:
  push:
    branches:
      - develop
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller flake8 pytest

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run pytest
        run: |
          pytest --version || echo "No tests found, skipping pytest"
          # pytest tests/ || true

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .github/scripts/build_windows.ps1

      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        shell: bash
        run: chmod +x .github/scripts/build_macos.sh && .github/scripts/build_macos.sh

      - name: Build Linux App in Docker
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "Building Docker image for Linux build..."
          docker build -t alchemy-linux-builder -f .github/docker/Dockerfile .
          
          echo "Running build inside Docker container..."
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            alchemy-linux-builder
          
          echo "Verifying build output..."
          ls -lh dist/

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Alchemy-Windows
          path: dist/Alchemy-Windows.exe
          retention-days: 7

      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Alchemy-macOS
          path: dist/Alchemy-macOS.zip
          retention-days: 7

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Alchemy-Linux
          path: dist/Alchemy-Linux
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          # Берём список коммитов с последнего тега (или все, если это первый релиз)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges $PREVIOUS_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Alchemy-Windows
          path: release-artifacts/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Alchemy-macOS
          path: release-artifacts/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Alchemy-Linux
          path: release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            *Automatically generated by GitHub Actions*
          files: |
            release-artifacts/Alchemy-Windows.exe
            release-artifacts/Alchemy-macOS.zip
            release-artifacts/Alchemy-Linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}